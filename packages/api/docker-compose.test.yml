# Infra efêmera para os testes e2e (Postgres + Redis).
# Uso: docker compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_USER: teste
      POSTGRES_PASSWORD: teste
      POSTGRES_DB: locacoes_teste
    ports: ["5433:5432"]
  redis-test:
    image: redis:7
    ports: ["6380:6379"]
