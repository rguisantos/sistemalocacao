# Infra efêmera para os testes e2e da API (Postgres + Redis em portas isoladas,
# para não colidir com uma instância de desenvolvimento). Referenciado por packages/api/test/TESTES.md.
#
#   docker compose -f docker-compose.test.yml up -d
#   export DATABASE_URL="postgresql://teste:teste@localhost:5433/locacoes_teste?schema=public"
#   export REDIS_URL="redis://localhost:6380"
#   export JWT_SECRET="segredo-de-teste-com-pelo-menos-32-caracteres!!"
#   export CONFIG_SECRET="outro-segredo-de-teste-com-32-ou-mais-caracteres"
#   npm -w @app/core run build
#   npm -w @app/api run prisma:generate
#   npx -w @app/api prisma migrate deploy --schema ../database/prisma/schema.prisma
#   npm -w @app/api run test:e2e
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres-teste:
    image: postgres:15
    environment:
      POSTGRES_USER: teste
      POSTGRES_PASSWORD: teste
      POSTGRES_DB: locacoes_teste
    ports: ['5433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teste -d locacoes_teste']
      interval: 5s
      timeout: 5s
      retries: 10
  redis-teste:
    image: redis:7
    ports: ['6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
